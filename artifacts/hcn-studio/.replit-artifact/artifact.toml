kind = "web"
previewPath = "/"
title = "H&CN Studio"
version = "1.0.0"
id = "artifacts/hcn-studio"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 24645
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/hcn-studio run dev"

[services.env]
PORT = "24645"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/hcn-studio", "run", "build"]
publicDir = "artifacts/hcn-studio/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
